<!DOCTYPE html>
<!--
  index.html - Portfolio Alessio Ventura
  -------------------------------------------------
  Versione "engineered": struttura chiara, commenti didattici,
  markup semantico e facile da estendere (i18n, nuove sezioni, ecc).
  Funzionalità mantenute identiche alla versione precedente.
-->
<html lang="it" data-theme="dark"> 
<!--
  lang="it" → dice al browser e agli screen reader che il testo è italiano.
  data-theme="dark" → attributo personalizzato usato da CSS + JS
                       per settare il tema scuro da default.
-->

<head>
  <meta charset="utf-8" />
  <!-- Supporta caratteri internazionali, emoji, accenti ecc -->

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!--
    Rende la pagina responsive su dispositivi mobili:
    - width=device-width → larghezza = schermo del device
    - initial-scale=1 → zoom iniziale senza ridimensionamenti strani
  -->

  <title>Alessio Ventura – Portfolio</title>
  <!-- Titolo che appare nella tab del browser -->

  <!-- favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Icona della tab del browser -->

  <!-- CSS esterno (mantieni il file style.css così com'è) -->
  <link rel="stylesheet" href="main.css">
  <!--
    Collega il foglio di stile principale.
    Mantenerlo esterno permette caching migliore e riuso in più pagine.
  -->
</head>

<body>
  <!--
    LOADER / PRELOADER
    -------------------------------------------------------------
    1) #site-loader → quello nuovo con il logo

    Attualmente il tuo script gestisce #site-loader.
  -->

  <!-- SITE LOADER (quello nuovo, gestito al 100% da script.js) -->
  <div id="site-loader" aria-hidden="true">
    <div class="loader-wrap">
      <!-- Logo SVG animato (stile AV / ALV) -->
      <svg viewBox="0 0 200 200" class="loader-logo" aria-hidden="true">
        <!-- Linea grande -->
        <path d="M50 150 L100 40 L150 150" class="stroke" stroke-width="12" fill="none"/>
        <!-- Linea piccola -->
        <path d="M70 150 L100 95 L130 150" class="stroke" stroke-width="8" fill="none"/>
      </svg>

      <!-- Testo sotto il logo -->
      <div class="loader-text">ALV • Loading</div>
    </div>
  </div>

  <!--
    SFONDO ANIMATO (PARTICELLE)
    -------------------------------------------------------------
    - Questo div rimane VUOTO.
    - Lo script.js crea dinamicamente tanti <span> con posizioni casuali.
    - aria-hidden="true" → decorativo, ignorato dagli screen reader.
  -->
  <div id="bg-anim" aria-hidden="true"></div>
